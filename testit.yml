name: testit

# Testit ajetaan simuloidulla PxWeb-palvelimella, joten ne eivät ota yhteyttä
# vero2.stat.fi:hin eivätkä kuormita rajapintaa.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Asenna riippuvuudet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aja testit
        run: python testit/test_tarkistukset.py
